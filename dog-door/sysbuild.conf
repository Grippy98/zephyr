# Build and sign the application for MCUboot.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="${APP_DIR}/keys/dog-door-signing.pem"

# ESP32 normally selects overwrite-only updates. Swap through the board's
# scratch partition so an unconfirmed update can revert to the prior image.
SB_CONFIG_MCUBOOT_MODE_SWAP_SCRATCH=y
